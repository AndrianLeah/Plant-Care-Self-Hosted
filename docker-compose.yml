services:
  # ── Backend API (Hono + Bun + SQLite) ─────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    restart: unless-stopped
    environment:
      DB_PATH: /data/plant-care.db
      PORT: "3000"
    volumes:
      - db_data:/data
    expose:
      - "3000"

  # ── Frontend (Vue SPA served by Nginx) ────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    volumes:
      # Optional TLS certs for HTTPS.
      # If missing, the container serves plain HTTP only on port 80.
      # Expected filenames when mounted:
      # - fullchain.pem
      # - privkey.pem
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  db_data:
